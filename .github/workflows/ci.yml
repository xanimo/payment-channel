# Each scenario builds koinu (libkw) itself at the pinned release tag via the
# build-koinu composite action, then runs: make check, contrib/regtest.sh
# against a real node, and a fuzz smoke. koinu is private and pc is public, so
# it is deliberately not passed as an artifact between jobs; a public run's
# artifacts are world-readable and that would leak the whole private tree. pc no
# longer depends on libdogecoin.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The koinu pin is not here: it lives in version.mk, which the build-koinu
# action sources. One copy of the tag, so it cannot drift from the Makefile's.

jobs:
  # test_channel, test/attack, the shell scenarios (loopback, sweep, keyguard,
  # signer, replicate), then the dribble case that outlasts the line deadline.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-koinu
        with:
          deploy-key: ${{ secrets.KOINU_DEPLOY_KEY }}
      # Which SHA-256 core the sighash vectors actually exercised. koinu picks
      # a hardware one at run time where the CPU has the instruction, and this
      # machine is the only record of whether that path was covered or whether
      # 156/156 means the scalar core alone.
      - run: |
          if grep -qw sha_ni /proc/cpuinfo; then
              echo "cpu has sha_ni: the vectors cover koinu's hardware sha256"
          else
              echo "cpu has no sha_ni: the vectors cover the scalar sha256 only"
          fi
      - run: make KOINU="$GITHUB_WORKSPACE/koinu" -j"$(nproc)"
      - run: make KOINU="$GITHUB_WORKSPACE/koinu" check
      - run: SLOW=1 ./test/slowpeer.sh

  # the only job that proves the transactions are valid: builds bob/alice on
  # koinu, funds a 2-of-2 on a released 1.14.9 node, and checks the close, the
  # refund and the sweep all confirm. KW is the same koinu build, so this also
  # checks --confirm-cmd/--broadcast-cmd against the real kw.
  regtest:
    runs-on: ubuntu-24.04
    env:
      # xanimo/docker feat/1.14.9: 1.14.9-on-bookworm, release binaries verified
      # against pinned sha256sums and the release signer key
      DOCKER_COMMIT: 208ac5a0a5f682a67f3b6e594029d7c37ea06717
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-koinu
        with:
          deploy-key: ${{ secrets.KOINU_DEPLOY_KEY }}
      - run: make KOINU="$GITHUB_WORKSPACE/koinu" -j"$(nproc)" alice bob test/mkfunding
      - name: build the node image
        run: |
          git clone https://github.com/xanimo/docker dogecoin-docker
          git -C dogecoin-docker checkout "$DOCKER_COMMIT"
          docker build -t dogecoin-regtest dogecoin-docker/1.14.9/bookworm
      - name: start the node
        run: |
          # kw talks to the node over p2p (not rpc), so the host must reach
          # 18444; bind it to loopback so it is not exposed on the runner's
          # external interface.
          docker run -d --name doge-ci -p 127.0.0.1:18444:18444 dogecoin-regtest \
              dogecoind -regtest -txindex=1 -listen=1 -printtoconsole
          printf '#!/bin/sh\nexec docker exec doge-ci dogecoin-cli "$@"\n' > doge-cli
          chmod +x doge-cli
          for _ in $(seq 1 120); do
              ./doge-cli -regtest getblockcount >/dev/null 2>&1 && break
              sleep 0.5
          done
          ./doge-cli -regtest getblockcount
          ./doge-cli -regtest generate 200 >/dev/null
      - name: regtest.sh with the real kw
        run: |
          chmod +x koinu/kw
          CLI="$GITHUB_WORKSPACE/doge-cli" KW="$GITHUB_WORKSPACE/koinu/kw" \
              ./contrib/regtest.sh
      - if: failure()
        run: docker logs doge-ci

  # the peer-facing parsers under asan and ubsan. setarch -R because asan's
  # shadow mapping collides with aslr before libFuzzer prints its banner.
  fuzz:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-koinu
        with:
          deploy-key: ${{ secrets.KOINU_DEPLOY_KEY }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
      - run: make KOINU="$GITHUB_WORKSPACE/koinu" fuzz
      - run: |
          for f in envelope txcheck opening refund payment; do
              mkdir -p "work-$f"
              setarch -R "./fuzz/fuzz_$f" "work-$f" "fuzz/corpus/$f" \
                  -max_total_time=60 -print_final_stats=1
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            crash-*
            timeout-*
            work-*
