# Clone and build koinu (libkw.a + secp256k1) at the pinned tag, in the job's
# own workspace. It is never uploaded as an artifact, so each job that needs
# libkw runs this and links the tag it names rather than whatever an earlier job
# happened to upload.
name: build koinu
description: clone and build koinu at the pinned tag into ./koinu
inputs:
  tag:
    description: koinu release tag to build; defaults to KOINU_TAG in version.mk
    required: false
  deploy-key:
    description: >-
      read-only SSH deploy key, used only if the public clone fails. koinu is
      public now, so this is a fallback for an outage rather than the path.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KOINU_TAG: ${{ inputs.tag }}
        KOINU_DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        # version.mk is the single source of the pin. It is KEY=value so it
        # sources here and `include`s in the Makefile, rather than the tag
        # living in the workflow as a second copy that drifts.
        if [ -z "${KOINU_TAG:-}" ]; then
            . ./version.mk
            echo "koinu tag $KOINU_TAG, from version.mk"
        else
            echo "koinu tag $KOINU_TAG, from the action input"
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends autoconf automake libtool
        if GIT_TERMINAL_PROMPT=0 git clone https://github.com/xanimo/koinu koinu 2>/dev/null; then
            echo "cloned koinu publicly"
        elif [ -n "${KOINU_DEPLOY_KEY:-}" ]; then
            rm -rf koinu
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$KOINU_DEPLOY_KEY" > ~/.ssh/koinu
            chmod 600 ~/.ssh/koinu
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            # exported, not just on the clone, so the tag fetch and the submodule
            # update below use the key too (the submodule is public secp256k1,
            # which any authenticated key may read)
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/koinu -o IdentitiesOnly=yes"
            git clone git@github.com:xanimo/koinu koinu
            echo "cloned koinu with the deploy key"
        else
            echo "koinu is not reachable and no deploy key is set" >&2
            exit 1
        fi
        git -C koinu fetch --tags --force
        git -C koinu checkout "$KOINU_TAG"
        git -C koinu submodule update --init --recursive
        make -C koinu -j"$(nproc)"
        ./koinu/kw --version
